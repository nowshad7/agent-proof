name: AgentProof
description: >-
  Verify agent-written changes against an acceptance contract and post a
  portable receipt to the pull request. Preview quality.
author: nowshad7

branding:
  icon: shield
  color: green

inputs:
  commit:
    description: Revision to resolve and snapshot (default HEAD).
    required: false
    default: HEAD
  repo:
    description: Repository directory to verify.
    required: false
    default: "."
  config:
    description: >-
      Optional path to a separately reviewed policy. Use this to apply a policy
      from a protected base branch so a candidate change cannot weaken its own
      gate. When empty, the committed agent-proof.json is used.
    required: false
    default: ""
  out:
    description: Directory for the receipt files.
    required: false
    default: ".agent-proof"
  version:
    description: >-
      AgentProof version to use. A release tag (for example v0.1.0) downloads a
      prebuilt binary; a branch or SHA builds from source.
    required: false
    default: main
  go-version:
    description: Go version used when building from source (fallback path).
    required: false
    default: "1.23"
  comment-on-pr:
    description: >-
      On pull_request events, post (and keep updated) a single receipt comment.
      Requires the calling job to grant pull-requests: write.
    required: false
    default: "true"

outputs:
  status:
    description: Overall receipt status (PASS, FAIL, UNVERIFIED, ERROR, SKIPPED).
    value: ${{ steps.verify.outputs.status }}
  receipt:
    description: Path to the generated receipt.json.
    value: ${{ steps.verify.outputs.receipt }}
  badge:
    description: >-
      Path to the generated Shields.io endpoint badge.json. Publish it (to
      GitHub Pages, a gist or a build artifact) and point a Shields endpoint
      badge at its URL for a live verification badge in your README.
    value: ${{ steps.verify.outputs.badge }}

runs:
  using: composite
  steps:
    # SECURITY: this Action runs the target repository's checks with the
    # privileges of the job it runs in. Do not use it under
    # pull_request_target with privileged credentials or secrets. Prefer a
    # disposable, unprivileged runner. See docs/guide/security.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install agentproof
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        bindir="$RUNNER_TEMP/agentproof-bin"
        mkdir -p "$bindir"

        os=linux; arch=amd64
        case "${RUNNER_OS:-Linux}" in
          Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;;
        esac
        case "${RUNNER_ARCH:-X64}" in
          X64) arch=amd64 ;; ARM64) arch=arm64 ;;
        esac

        # A release tag downloads a prebuilt binary; anything else builds.
        if [[ "$VERSION" =~ ^v[0-9] ]]; then
          ver="${VERSION#v}"
          url="https://github.com/nowshad7/agent-proof/releases/download/${VERSION}/agentproof_${ver}_${os}_${arch}.tar.gz"
          echo "Trying prebuilt binary: $url"
          if curl -fsSL "$url" -o "$RUNNER_TEMP/ap.tgz"; then
            tar -xzf "$RUNNER_TEMP/ap.tgz" -C "$bindir"
            echo "$bindir" >> "$GITHUB_PATH"
            echo "Installed prebuilt agentproof $VERSION"
            exit 0
          fi
          echo "No prebuilt binary for $VERSION; building from source."
        fi

        GOBIN="$bindir" go install "github.com/nowshad7/agent-proof/cmd/agentproof@${VERSION}"
        echo "$bindir" >> "$GITHUB_PATH"
        echo "Built agentproof from source ($VERSION)"

    - name: Verify
      id: verify
      shell: bash
      run: |
        set -uo pipefail
        args=(verify --trust-local --repo "${{ inputs.repo }}" \
          --commit "${{ inputs.commit }}" --out "${{ inputs.out }}" \
          --runner "github-actions/${{ github.sha }}")
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi

        # Capture the gate result without aborting, so the receipt can still be
        # posted to the PR on failure.
        set +e
        agentproof "${args[@]}"
        code=$?
        set -e

        receipt="${{ inputs.out }}/receipt.json"
        badge="${{ inputs.out }}/badge.json"
        status="ERROR"
        if [ -f "$receipt" ]; then
          parsed="$(grep -o '"status": *"[A-Z]*"' "$receipt" | head -n1 | grep -oE '[A-Z]+' | head -n1)"
          [ -n "$parsed" ] && status="$parsed"
        fi
        {
          echo "status=$status"
          echo "receipt=$receipt"
          echo "badge=$badge"
          echo "exitcode=$code"
        } >> "$GITHUB_OUTPUT"

    - name: Render PR comment body
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/agentproof-comment.md"
        receipt="${{ steps.verify.outputs.receipt }}"
        if [ -f "$receipt" ]; then
          agentproof report --input "$receipt" --format gh > "$out"
        else
          {
            echo "<!-- agentproof-receipt -->"
            echo "### ❌ AgentProof — ERROR"
            echo
            echo "Verification could not produce a receipt (configuration or execution error). Check the job logs."
          } > "$out"
        fi

    - name: Upsert PR comment
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP + '/agentproof-comment.md';
          if (!fs.existsSync(path)) return;
          const body = fs.readFileSync(path, 'utf8');
          const marker = '<!-- agentproof-receipt -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Gate
      if: ${{ always() }}
      shell: bash
      run: exit ${{ steps.verify.outputs.exitcode }}
