name: CI

on:
  push:
    branches: [main]
  pull_request:

# Verification jobs carry no deployment privileges.
permissions:
  contents: read

jobs:
  go:
    name: Go tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build CLI
        run: go build -o /tmp/agentproof ./cmd/agentproof

  examples:
    name: Runnable examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run examples through the CLI
        run: ./examples/run-examples.sh

  self:
    name: Self-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build CLI
        run: go build -o /tmp/agentproof ./cmd/agentproof

      - name: Verify this repository's own contract
        run: /tmp/agentproof verify --trust-local --runner "ci/${{ github.sha }}"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-receipt
          path: .agent-proof/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build
